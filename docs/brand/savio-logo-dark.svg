<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 490 168" role="img" aria-label="SAVIO — AI agent for IT operations">
  <!-- Dark lockup. Carries its own navy panel so the white wordmark stays visible
       wherever it is dropped (docs, white slides, chat previews). Mark is savio-icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="io" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="-20" y="-20" width="490" height="168" rx="24" fill="#0b1220"/>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <path d="M50 10.5 A17 17 0 0 0 50 29.5 M78 10.5 A17 17 0 0 1 78 29.5" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M43 5 A25 25 0 0 0 43 35 M85 5 A25 25 0 0 1 85 35" stroke="#67e8f9" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M64 38 V30" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M64 9 Q65.8 18.2 75 20 Q65.8 21.8 64 31 Q62.2 21.8 53 20 Q62.2 18.2 64 9 Z" fill="#fff"/>
  <path d="M90 56 Q89 44 64 44 Q38 44 38 60 Q38 68 46 71 M82 87 Q90 91 90 100 Q90 112 64 112 Q39 112 38 102" stroke="#fff" stroke-width="12" stroke-linecap="round" fill="none"/>
  <rect x="33" y="66" width="62" height="24" rx="12" fill="#0b1220" stroke="#fff" stroke-width="3"/>
  <g fill="#67e8f9" filter="url(#glow)">
    <rect x="47" y="73" width="11" height="10" rx="5"/>
    <rect x="70" y="73" width="11" height="10" rx="5"/>
  </g>
  <!-- telemetry inside the S: a live pulse up top, CPU/RAM/disk/network bars below -->
  <path d="M48 58 H56 L60 52 L65 63 L69 55 L72 58 H82" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g fill="#67e8f9">
    <rect x="52" y="99" width="4" height="6" rx="1.5"/>
    <rect x="59" y="96" width="4" height="9" rx="1.5"/>
    <rect x="66" y="98" width="4" height="7" rx="1.5"/>
    <rect x="73" y="94" width="4" height="11" rx="1.5"/>
  </g>
  <text x="152" y="82" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="5" fill="#ffffff">SAV<tspan fill="url(#io)">IO</tspan></text>
  <text x="155" y="111" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14.5" font-weight="600" letter-spacing="2.6" fill="#94a3b8">AI AGENT FOR IT OPERATIONS</text>
</svg>
