name: Deploy Website (technomateai.com)

# Builds the static marketing site in website/ and uploads it to Hostinger
# via FTP. Runs automatically on any push to main that touches website/, and
# can be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

# Never run two deploys at once (avoids half-uploaded state).
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Public analytics IDs (baked into the static build). Not secrets —
          # set these as repo variables if you'd rather not hardcode them.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'G-GKPCWJGVEY' }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}

      # The PHP lead handler is not part of the Next.js build — it lives outside `src/`
      # and the static export knows nothing about it — so it has to be placed into `out/`
      # by hand to reach the server.
      #
      # It was NOT here before, while the comment below claimed the handler shipped with
      # the site. So the file only ever reached production by manual upload, code fixes to
      # it never shipped, and the FTP sync could remove a copy it had not placed there.
      # Same conclusion as content.json and pricing.json: git is the source of truth, and
      # a file the server owns is a file that silently drifts.
      #
      # mail-config.php is deliberately NOT copied — it holds the mailbox password and the
      # intake secret, is gitignored, and stays excluded from the sync below so the
      # server's copy survives every release.
      - name: Stage the PHP lead handler for upload
        run: |
          cp hostinger/contact.php out/contact.php
          echo "staged: $(wc -c < out/contact.php) bytes"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Upload the built site. If technomateai.com is an ADDON/subdomain on
          # this account, change this to its folder (e.g. /domains/technomateai.com/public_html/).
          local-dir: ./website/out/
          server-dir: /public_html/
          # Protect server-only mailbox configuration. The versioned PHP handler
          # is copied into out/ by the step above, so lead-capture fixes are
          # released with the site — which is what this line has always claimed
          # and, until that step existed, was not true.
          # content.json and pricing.json are git-controlled and deploy from
          # source: keeping content.json server-editable meant a stale copy on
          # the server silently overrode newly shipped copy at runtime, leaving
          # the site half-updated. Code is now the single source of truth for
          # both site text and prices — edit website/public/*.json and push.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/mail-config.php

      # Instant indexing for Bing + Yandex (IndexNow). Reads every URL from the
      # freshly built sitemap and pings the shared IndexNow API, so new/changed
      # pages get picked up in minutes instead of waiting for a crawl. Google
      # doesn't consume IndexNow — it discovers pages via the deployed sitemap.
      # Non-blocking: a failed ping never fails the deploy.
      - name: Notify IndexNow (Bing / Yandex)
        if: success()
        continue-on-error: true
        run: |
          KEY="94693e40dbb9f994af1be32ed2779f3d"
          HOST="technomateai.com"
          URLS=$(grep -oE '<loc>[^<]+</loc>' out/sitemap.xml | sed -E 's#</?loc>##g')
          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          echo "Submitting $COUNT URLs to IndexNow"
          BODY=$(printf '%s\n' "$URLS" | jq -R 'select(length>0)' | jq -sc \
            --arg host "$HOST" --arg key "$KEY" \
            --arg loc "https://$HOST/$KEY.txt" \
            '{host:$host,key:$key,keyLocation:$loc,urlList:.}')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" -w "\nIndexNow HTTP %{http_code}\n"
