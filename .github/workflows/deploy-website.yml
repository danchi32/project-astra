name: Deploy Website (technomateai.com)

# Builds the static marketing site in website/ and uploads it to Hostinger
# via FTP. Runs automatically on any push to main that touches website/, and
# can be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch: {}

# Never run two deploys at once (avoids half-uploaded state).
concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          # Public analytics IDs (baked into the static build). Not secrets —
          # set these as repo variables if you'd rather not hardcode them.
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'G-GKPCWJGVEY' }}
          NEXT_PUBLIC_CLARITY_ID: ${{ vars.NEXT_PUBLIC_CLARITY_ID }}

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Upload the built site. If technomateai.com is an ADDON/subdomain on
          # this account, change this to its folder (e.g. /domains/technomateai.com/public_html/).
          local-dir: ./website/out/
          server-dir: /public_html/
          # Protect files that live on the server but are NOT part of out/.
          # contact.php + mail-config.php are the PHP mailer (uploaded manually).
          # content.json stays server-editable (site text can be tweaked in
          # Hostinger File Manager without a rebuild). pricing.json is now
          # git-controlled — it deploys from source so code is the single source
          # of truth for prices.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/contact.php
            **/mail-config.php
            **/content.json
