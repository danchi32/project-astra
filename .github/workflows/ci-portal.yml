name: CI Portal

# The portal had no CI: its 19 Vitest tests and the typecheck only ever ran locally.
# Vercel builds on deploy, so a broken build was caught eventually — but a failing test or a
# type error could reach production unnoticed. This gates them on every push.
#
# Deploy stays with Vercel's own git integration; this workflow only verifies.
on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/ci-portal.yml"
  pull_request:
    paths:
      - "portal/**"
  workflow_dispatch: {}

concurrency:
  group: ci-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # Catches what typecheck can't: bad imports, server/client boundary mistakes, and
      # anything that only fails at build time.
      - name: Production build
        run: npm run build
