name: Deploy Backend (Cloud Run)

# Replaces Railway's git-connected auto-deploy. Railway rebuilt on every push to main;
# Cloud Run has no such hook, so without this a normal `git push` would silently leave
# production on the previous image.
#
# Runs on any push to main touching backend/, and can be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

# Never let two deploys race — the migration step must not run concurrently.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  PROJECT_ID: astra-prod-503923
  REGION: asia-southeast1
  SERVICE: astra-backend
  REPO: astra

permissions:
  contents: read
  id-token: write        # required for keyless auth to Google (Workload Identity)

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # requirements-dev.txt pulls in requirements.txt plus the test stack. It is not
      # optional: the suite runs against an in-memory SQLite database, so without
      # aiosqlite every test errors on engine creation.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Full suite — it is green (320 passing), so there is no reason to gate on a subset.
      # Random ordering is left ON (pytest-randomly's default) so cross-test state leaks
      # surface here rather than in production.
      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Keyless: GitHub's OIDC token is exchanged for short-lived Google credentials.
      # No service-account JSON key exists, so there is no long-lived secret to leak.
      # The pool provider is restricted to this repo owner and the SA binding to this
      # repo, so no other repository can assume it.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1041631804427/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-deploy@astra-prod-503923.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Submit ASYNC and poll the build ourselves, rather than letting `gcloud builds
      # submit` block.
      #
      # Why: in the synchronous form the command exited non-zero on two consecutive runs
      # even though the build SUCCEEDED and pushed the correct image — the failure was in
      # gcloud's post-build handling (it streams from a Google-managed logs bucket outside
      # this project, which project-level storage roles don't cover), not in the build.
      # `--suppress-logs` did not resolve it. Polling the build's own status makes the step
      # depend only on the build result, which is the thing we actually care about, and
      # removes the failure mode instead of guessing at it.
      - name: Build image via Cloud Build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/backend:${GITHUB_SHA::7}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          BUILD_ID=$(gcloud builds submit --async --tag "$IMAGE" --region "$REGION" \
            --format='value(id)' .)
          echo "build id: $BUILD_ID"
          echo "logs: https://console.cloud.google.com/cloud-build/builds;region=${REGION}/${BUILD_ID}?project=${PROJECT_ID}"

          # Builds take ~1 min; allow 20.
          for i in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --region "$REGION" --format='value(status)')
            case "$STATUS" in
              SUCCESS)
                echo "build succeeded"; exit 0 ;;
              FAILURE|TIMEOUT|CANCELLED|EXPIRED|INTERNAL_ERROR)
                echo "build ended as $STATUS — see the logs URL above"; exit 1 ;;
            esac
            echo "  [$i] $STATUS"
            sleep 10
          done
          echo "build did not finish within 20 minutes"; exit 1

      # Migrations run ONCE here, not per instance: entrypoint.sh is told to skip them
      # (RUN_MIGRATIONS_ON_START=false) because parallel Cloud Run cold starts would
      # otherwise race on `alembic upgrade`.
      #
      # The job needs ASTRA_JWT_SECRET_KEY as well as the database URL — alembic/env.py
      # calls get_settings(), which validates the entire Settings model.
      - name: Run database migrations
        run: |
          gcloud run jobs deploy astra-migrate \
            --image "$IMAGE" --region "$REGION" \
            --set-secrets ASTRA_DATABASE_URL=ASTRA_DATABASE_URL:latest,ASTRA_JWT_SECRET_KEY=ASTRA_JWT_SECRET_KEY:latest \
            --command alembic --args upgrade,head --quiet
          gcloud run jobs execute astra-migrate --region "$REGION" --wait

      - name: Deploy to Cloud Run
        run: |
          SECRETS=ASTRA_DATABASE_URL=ASTRA_DATABASE_URL:latest
          SECRETS=$SECRETS,ASTRA_JWT_SECRET_KEY=ASTRA_JWT_SECRET_KEY:latest
          SECRETS=$SECRETS,ASTRA_ANTHROPIC_API_KEY=ASTRA_ANTHROPIC_API_KEY:latest
          # Encrypts the third-party credentials an org entrusts to us (the helpdesk API
          # key today). Rotating it makes every stored credential undecryptable, so it is
          # a restore-this-one item in the DR notes, not just another secret.
          SECRETS=$SECRETS,ASTRA_SECRETS_KEY=ASTRA_SECRETS_KEY:latest
          SECRETS=$SECRETS,ASTRA_RESEND_API_KEY=ASTRA_RESEND_API_KEY:latest
          SECRETS=$SECRETS,ASTRA_EMAIL_FROM=ASTRA_EMAIL_FROM:latest
          SECRETS=$SECRETS,ASTRA_PAYPAL_CLIENT_ID=ASTRA_PAYPAL_CLIENT_ID:latest
          SECRETS=$SECRETS,ASTRA_PAYPAL_CLIENT_SECRET=ASTRA_PAYPAL_CLIENT_SECRET:latest
          SECRETS=$SECRETS,ASTRA_PAYPAL_PLAN_ID=ASTRA_PAYPAL_PLAN_ID:latest
          SECRETS=$SECRETS,ASTRA_PAYPAL_WEBHOOK_ID=ASTRA_PAYPAL_WEBHOOK_ID:latest

          ENVVARS=RUN_MIGRATIONS_ON_START=false
          ENVVARS=$ENVVARS,ASTRA_ENVIRONMENT=production
          ENVVARS=$ENVVARS,ASTRA_PUBLIC_API_URL=https://api.astra.technomateai.com
          ENVVARS=$ENVVARS,ASTRA_PUBLIC_APP_URL=https://astra.technomateai.com/login
          ENVVARS=$ENVVARS,ASTRA_PRICE_PER_SEAT_CENTS=749
          ENVVARS=$ENVVARS,ASTRA_PAYPAL_SANDBOX=false
          ENVVARS=$ENVVARS,ASTRA_AGENT_UPDATE_MANIFEST_URL=https://github.com/danchi32/project-astra/releases/latest/download/manifest.json
          ENVVARS=$ENVVARS,ASTRA_AGENT_UPDATE_SIGNATURE_URL=https://github.com/danchi32/project-astra/releases/latest/download/manifest.json.sig
          ENVVARS=$ENVVARS,ASTRA_AGENT_BACKEND_IP=

          # max-instances is capped by the project's regional CPU quota
          # (CpuAllocPerProjectRegion = 20000 mCPU = 20 vCPU, and each instance takes 1),
          # so 20 is the ceiling until that quota is raised. It must be repeated here:
          # `gcloud run deploy` resets anything not passed, so a value set by hand with
          # `services update` would be silently reverted by the next deploy.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" \
            --min-instances 1 --max-instances 20 --concurrency 80 --port 8000 \
            --cpu 1 --memory 512Mi --timeout 60s \
            --allow-unauthenticated \
            --set-secrets "$SECRETS" \
            --set-env-vars "$ENVVARS" \
            --quiet

      # Gate on the revision's OWN url: that is what this deploy is responsible for.
      # Custom-domain DNS and certificate state are one-time infrastructure that a code
      # deploy neither changes nor controls, so they must not be able to fail it.
      - name: Verify the new revision is healthy
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "revision url: $URL"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$URL/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "healthy:"; curl -s "$URL/health"; echo; exit 0
            fi
            echo "attempt $i: HTTP $CODE"; sleep 10
          done
          echo "New revision did not become healthy."
          exit 1

      - name: Custom domain check (informational)
        continue-on-error: true
        run: |
          CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' https://api.astra.technomateai.com/health || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "api.astra.technomateai.com is serving this backend."
          else
            echo "::warning::Custom domain returned HTTP $CODE — expected while the managed"
            echo "::warning::certificate is still provisioning, or if DNS still points elsewhere."
          fi
